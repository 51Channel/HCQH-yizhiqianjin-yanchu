# 开场片头底下的台词（插件 config.yml 里 op-lines 这一段）
# 开场片头底下的台词（11-23：「这个预览，其实要底下有个字幕台词之类的，要让我来读，不然的话没有感觉」）。
# 像电影字幕一样出在下面黑边里，所有人都看得见，主播照着读。{n} = 进场人数；留空 = 那一段不出字。改完 /zd reload 或重开服生效。
# 每段多长（正常节奏）：light1 约 5 秒、light2 约 5 秒、每个场地 2 秒出头（一句别超过 10 个字）、line 约 7 秒、host 约 7 秒。
op-lines:
  # 11-25 用户：「开头 2 句话介绍得很不明不白」+ 外部审查：片头只讲这是什么局、赢了得到什么、怎么一层层往下；
  # 心、受伤、出局留给紧接着的「游戏目标」讲，两边不重复。11-25 用户：「按照他给的文案表完整翻修」——四句照外部审查第二版的文案表，dare 和屏幕大字统一说「主持人」
  light1: "欢迎来到《一掷千金》，最后活下来的人，赢走神秘大奖"
  light2: "六场游戏，从最外圈一层一层淘汰到坑底"
  line: "{n} 个人现在还站在一起，从这一刻起，都是对手"
  host: "坑底的通关席，只留给最后的胜者"
  # 11-25 主持人正脸近景，对镜头下战书
  dare: "在决战里打败主持人，赢走神秘大奖"
  # 11-25 文案改稿：六个场地快切只留「第几幕 + 名字」，底下不出字（留空 = 不出）；想垫字就填一句，别超过 8 个字
  acts:
    零点八: ""
    三道门: ""
    撞号: ""
    高压: ""
    盲牌: ""
    失控列车: ""
    限定猜拳: ""
    弑君: ""
    最后一盏灯: ""

# 第五幕「站队」的题库在插件包里的 survey.yml（11-23 起不放这里：服务器上存过的旧设置会挡住新题）。

# 等候区（赫朝摸鱼厅装进这台服当开场前的等候区）：开局前、收场后各调一条命令。没装摸鱼厅插件就自动不调。
lobby-hooks:
  start: "moyu lobby go"     # 等候区里的人全部送进场地大门
  end: "moyu lobby back"     # 所有人送回等候区
